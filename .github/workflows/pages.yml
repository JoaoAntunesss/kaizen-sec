name: Publicar site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Chave do Groq (segredo GROQ_API_KEY)
        env: { GROQ: '${{ secrets.GROQ_API_KEY }}' }
        run: |
          if [ -z "$GROQ" ]; then echo "::warning::Falta o segredo GROQ_API_KEY: a leitura das fotos fica desligada."; exit 0; fi
          python3 -c "import os,pathlib; p=pathlib.Path('config.js'); p.write_text(p.read_text().replace('__GROQ_API_KEY__', os.environ['GROQ']))"
      - name: Versão no service worker
        run: sed -i "s/kaizen-v1/kaizen-${GITHUB_SHA::7}/" sw.js
      - name: Preparar
        run: mkdir _site && cp -r index.html style.css app.js config.js sw.js manifest.webmanifest icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
